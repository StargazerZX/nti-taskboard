apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          securityContext:
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          image: nti-cicd-backend:latest
          imagePullPolicy: Never
          env:
            - name: APP_VERSION
              value: v1.0.0
            - name: ENVIRONMENT
              value: kubernetes
            - name: CORS_ORIGINS
              value: "*"
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: db-credentials
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: "/api/health"
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/api/health/ready"
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          ports:
            - containerPort: 8000
      initContainers:
        - name: db-checker
          image: busybox:1.36
          securityContext:
            runAsUser: 1001
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do sleep 2; done']

---

apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
