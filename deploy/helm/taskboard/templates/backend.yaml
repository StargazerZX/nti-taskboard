apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mychart.fullname" . }}-backend-deployment
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ include "mychart.fullname" . }}-backend
  replicas: {{ .Values.backend.replicas }}
  template:
    metadata:
      labels:
        app: {{ include "mychart.fullname" . }}-backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: {{ include "mychart.fullname" . }}-backend
          securityContext:
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.image_pull }}
          env:
            - name: APP_VERSION
              value: {{ .Values.backend.version }}
            - name: ENVIRONMENT 
              value: {{ .Values.backend.environment }}
            - name: CORS_ORIGINS
              value: {{ .Values.backend.cors_origins | quote }}
            - name: DB_HOST
              value: {{ include "mychart.fullname" . }}-postgres-service
            - name: DB_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: {{ include "mychart.fullname" . }}-db-credentials
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: "/api/health"
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/api/health/ready"
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          ports:
            - containerPort: 8000
              name: api
      initContainers:
        - name: {{ include "mychart.fullname" . }}-db-checker
          image: busybox:1.36
          securityContext:
            runAsUser: 1001
          command: ['sh', '-c', 'until nc -z {{ include "mychart.fullname" . }}-postgres-service 5432; do sleep 2; done']

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "mychart.fullname" . }}-backend-service
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "mychart.fullname" . }}-backend
  ports:
    - port: 8000
      targetPort: api
