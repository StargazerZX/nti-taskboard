{{- if .Values.credentials.externalSecret.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mychart.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.credentials.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.credentials.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "mychart.fullname" . }}-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_NAME
      remoteRef:
        key: {{ .Values.credentials.externalSecret.remoteRef.key }}
        property: db_name
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.credentials.externalSecret.remoteRef.key }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.credentials.externalSecret.remoteRef.key }}
        property: password
{{- else -}}
apiVersion: v1
kind: Secret 
metadata:
  name: {{ include "mychart.fullname" . }}-db-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DB_NAME: {{ .Values.credentials.db_name }}
  DB_USER: {{ .Values.credentials.user }}
  DB_PASSWORD: {{ .Values.credentials.password }}
{{ end }}